<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI/UX 학습 사이트 - 레이아웃</title>
    <link rel="stylesheet" href="./asstes/css/common.css">
</head>
<body>
    <div class="app-layout">
        <aside id="sidebar-root"></aside>

        <main class="content-area">
            <section class="content-section">
                <h1>레이아웃 학습</h1>
                <p class="lead-text">그리드, 정렬, 여백, 시각적 계층을 중심으로 정리합니다.</p>
            </section>

            <section class="content-section">
                <h2>이미지</h2>
                <img src="./asstes/images/menu-banner.svg" alt="레이아웃 학습 이미지" class="content-image">
            </section>

            <section class="content-section">
                <h2>프롬프트</h2>
                <div class="content-card">"카드 3개가 반응형으로 정렬되는 레이아웃을 만들어줘."</div>
            </section>

            <section class="content-section">
                <h2>코드</h2>
                <pre class="code-block"><code>.card-wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}</code></pre>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="./asstes/js/menu.js"></script>
    <script src="./asstes/js/common.js"></script>
</body>
</html>
